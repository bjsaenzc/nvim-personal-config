# ~/.config/tmux/tmux.conf  (or ~/.tmux.conf)

# ---------- Terminal / Ghostty / Neovim ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-ghostty:extkeys"   # true color + modern key encoding
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'                     # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colors
set -s escape-time 0          # no delay on Esc in Neovim
set -g focus-events on        # Neovim autoread / focus autocmds
set -s extended-keys on
set -s set-clipboard on       # OSC 52 — Ghostty forwards yanks to system clipboard
set -g history-limit 50000

# ---------- Prefix ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------- General ----------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-keys emacs
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ---------- Splits / windows (keep current path) ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---------- Pane navigation: Ctrl-h/j/k/l shared with Neovim ----------
# Pair with christoomey/vim-tmux-navigator in Neovim.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ---------- Resize (repeatable) ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z          # toggle zoom

# ---------- Window switching ----------
bind -n M-h previous-window     # Alt-h / Alt-l
bind -n M-l next-window
bind -r Tab last-window
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# ---------- Copy mode (vi) ----------
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind p paste-buffer

# ---------- Sessions ----------
bind s choose-tree -Zs
bind S command-prompt -p "new session:" "new-session -A -s '%%'"
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# ---------- Status line (minimal) ----------
set -g status-position bottom
set -g status-style "bg=default,fg=#21b02e"
set -g status-left "#[bold]#S #[nobold]| "
set -g status-right "%H:%M"
setw -g window-status-current-format "#[bold]#I:#W"
setw -g window-status-format "#I:#W"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-style "fg=#3b4261"
